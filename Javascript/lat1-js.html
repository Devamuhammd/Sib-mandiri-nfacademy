<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Luas Bangun Datar - Deva</title>
    <link rel="icon" href="Gambar/logo_nf_academy_color-e1606149852131.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        h2 {
            font-family:'Times New Roman', Times, serif;
            color: #b10303;
        }
        h3 {
            font-family: 'Times New Roman', Times, serif;
            margin: auto;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 5px solid #000000;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        input, button {
            margin: 5px;
            padding: 10px;
            border: 2px solid #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Gambar/logo_nf_academy_color-e1606149852131.png" class="img-thumbnail" alt="NFACADEMY" width="70px">
        <h2>Kalkulator Luas Bangun Datar</h2>

        <!-- Persegi Panjang -->
        <h3>Luas Persegi Panjang</h3>
        <input type="number" id="panjang" placeholder="Masukkan panjang">
        <input type="number" id="lebar" placeholder="Masukkan lebar">
        <button onclick="hitungLuasPersegiPanjang()">Hitung</button>
        <p id="hasilPersegiPanjang"></p>

        <!-- Bujur Sangkar -->
        <h3>Luas Bujur Sangkar</h3>
        <input type="number" id="sisi" placeholder="Masukkan sisi">
        <button onclick="hitungLuasBujurSangkar()">Hitung</button>
        <p id="hasilBujurSangkar"></p>

        <!-- Segitiga -->
        <h3>Luas Segitiga</h3>
        <input type="number" id="alas" placeholder="Masukkan alas">
        <input type="number" id="tinggi" placeholder="Masukkan tinggi">
        <button onclick="hitungLuasSegitiga()">Hitung</button>
        <p id="hasilSegitiga"></p>
    </div>

    <script>
        // Fungsi menghitung luas persegi panjang (panjang * lebar)
        function hitungLuasPersegiPanjang() {
            let panjang = document.getElementById("panjang").value;
            let lebar = document.getElementById("lebar").value;
            let luas = panjang * lebar;
            document.getElementById("hasilPersegiPanjang").innerText = "Luas: " + luas + " satuan²";
        }

        // Fungsi menghitung luas bujur sangkar (sisi * sisi)
        function hitungLuasBujurSangkar() {
            let sisi = document.getElementById("sisi").value;
            let luas = sisi * sisi;
            document.getElementById("hasilBujurSangkar").innerText = "Luas: " + luas + " satuan²";
        }

        // Fungsi menghitung luas segitiga (1/2 * alas * tinggi)
        function hitungLuasSegitiga() {
            let alas = document.getElementById("alas").value;
            let tinggi = document.getElementById("tinggi").value;
            let luas = 0.5 * alas * tinggi;
            document.getElementById("hasilSegitiga").innerText = "Luas: " + luas + " satuan²";
        }
    </script>

</body>
</html>
